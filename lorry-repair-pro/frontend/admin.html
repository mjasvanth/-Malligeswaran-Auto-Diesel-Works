<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Malligeswaran Auto Diesel Works</title><link rel="stylesheet" href="style.css"><style>.admin-wrap{padding:55px 0}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.admin-card{background:#fff;border:1px solid #e4e8ef;border-radius:16px;padding:22px;box-shadow:0 8px 25px rgba(16,24,39,.05)}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #e9edf3;text-align:left;font-size:14px}th{background:#f6f8fb}.badge{padding:5px 9px;border-radius:999px;background:#edf4ff;color:#1769c2;font-weight:700}.hide{display:none}.login-form{display:grid;gap:14px;max-width:420px}.login-form label{font-size:14px;font-weight:700}.login-form input,.booking-search{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #d7dde7;border-radius:8px;font:inherit}.table-wrap{overflow-x:auto}.error{color:#c62828;font-weight:700;margin:0}.admin-links{display:flex;gap:12px;flex-wrap:wrap}.admin-actions{display:flex;gap:10px;align-items:center}.booking-search{width:300px;margin:0}</style></head><body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html">🚛 Malligeswaran <b>AUTO DIESEL</b></a><nav><a href="index.html">Website</a><a href="shop-collab-admin.html">Shop Collab</a><button id="logoutBtn" class="btn secondary">Logout</button></nav></div></header>
<main class="admin-wrap"><div class="container"><div class="admin-top"><div><span class="eyebrow">WORKSHOP CONTROL PANEL</span><h2>Service Bookings</h2><div class="admin-links"><a href="shop-collab-admin.html">View Shop Collaboration Requests</a></div></div><div class="admin-actions"><input id="bookingSearch" class="booking-search" type="search" placeholder="Search name, mobile or vehicle number"><button id="refreshBtn" class="btn primary">Refresh</button></div></div><div id="loginBox" class="admin-card"><h3>Admin login</h3><form id="loginForm" class="login-form"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">Login</button><p id="loginMessage" class="error" aria-live="polite"></p></form></div><div id="adminContent" class="admin-card hide"><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Customer</th><th>Vehicle</th><th>Service</th><th>Complaint</th><th>Booking date</th><th>Status</th><th></th></tr></thead><tbody id="bookingRows"></tbody></table></div></div></div></main><script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
